name: Publish Hoor Game Web Version

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build static game site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp public/Hoor-Plays-Learns-Android.html _site/index.html
          cp public/manifest.webmanifest _site/manifest.webmanifest
          cp public/icon.svg _site/icon.svg
          cp public/apple-touch-icon.png _site/apple-touch-icon.png
          cp public/pwa-192x192.png _site/pwa-192x192.png
          cp public/pwa-512x512.png _site/pwa-512x512.png
          cp public/pwa-maskable-512x512.png _site/pwa-maskable-512x512.png
          cp public/robots.txt _site/robots.txt
          cp _site/index.html _site/404.html
          touch _site/.nojekyll

      - name: Publish gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          cd _site
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Deploy game ${GITHUB_SHA}"
          git branch -M gh-pages
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
